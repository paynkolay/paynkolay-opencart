name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin zips
        run: ./build.sh

      - name: Rename zips with version
        run: |
          for f in dist/*.ocmod.zip; do
            mv "$f" "${f%.ocmod.zip}-${{ github.ref_name }}.ocmod.zip"
          done
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ocmod.zip
          generate_release_notes: true
