services:
  # ──────────────────────────────────────────────
  # Landing page — http://localhost:8080
  # ──────────────────────────────────────────────
  landing:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./landing:/usr/share/nginx/html:ro

  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: opencart
      MYSQL_PASSWORD: opencart
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  # ──────────────────────────────────────────────
  # OpenCart 2.0.3.1 — http://localhost:8020
  # ──────────────────────────────────────────────
  opencart20:
    build:
      context: .
      dockerfile: docker/opencart-2.0/Dockerfile
    ports:
      - '8020:80'
    volumes:
      - ./opencart-2.0/admin/controller/payment:/var/www/html/admin/controller/payment
      - ./opencart-2.0/admin/language/english/payment:/var/www/html/admin/language/english/payment
      - ./opencart-2.0/admin/view/template/extension/payment:/var/www/html/admin/view/template/extension/payment
      - ./opencart-2.0/admin/view/image/payment:/var/www/html/admin/view/image/payment
      - ./opencart-2.0/catalog/controller/payment:/var/www/html/catalog/controller/payment
      - ./opencart-2.0/catalog/language/english/payment:/var/www/html/catalog/language/english/payment
      - ./opencart-2.0/catalog/model/payment:/var/www/html/catalog/model/payment
      - ./opencart-2.0/catalog/view/theme/default/template/payment:/var/www/html/catalog/view/theme/default/template/payment
      - ./opencart-2.0/system/library/paynkolay.php:/var/www/html/system/library/paynkolay.php
    depends_on:
      - db

  # ──────────────────────────────────────────────
  # OpenCart 2.3.0.2 — http://localhost:8023
  # ──────────────────────────────────────────────
  opencart23:
    build:
      context: .
      dockerfile: docker/opencart-2.3/Dockerfile
    ports:
      - '8023:80'
    volumes:
      - ./opencart-2.3/admin/controller/extension/payment:/var/www/html/admin/controller/extension/payment
      - ./opencart-2.3/admin/language/en-gb/extension/payment:/var/www/html/admin/language/en-gb/extension/payment
      - ./opencart-2.3/admin/view/template/extension/payment:/var/www/html/admin/view/template/extension/payment
      - ./opencart-2.3/admin/view/image/payment:/var/www/html/admin/view/image/payment
      - ./opencart-2.3/catalog/controller/extension/payment:/var/www/html/catalog/controller/extension/payment
      - ./opencart-2.3/catalog/language/en-gb/extension/payment:/var/www/html/catalog/language/en-gb/extension/payment
      - ./opencart-2.3/catalog/model/extension/payment:/var/www/html/catalog/model/extension/payment
      - ./opencart-2.3/catalog/view/theme/default/extension/payment:/var/www/html/catalog/view/theme/default/template/extension/payment
      - ./opencart-2.3/system/library/paynkolay.php:/var/www/html/system/library/paynkolay.php
    depends_on:
      - db

  # ──────────────────────────────────────────────
  # OpenCart 3.0.3.9 — http://localhost:8030
  # ──────────────────────────────────────────────
  opencart3x:
    build:
      context: .
      dockerfile: docker/opencart-3.x/Dockerfile
    ports:
      - '8030:80'
    volumes:
      - ./opencart-3.x/admin/controller/extension/payment:/var/www/html/admin/controller/extension/payment
      - ./opencart-3.x/admin/language/en-gb/extension/payment:/var/www/html/admin/language/en-gb/extension/payment
      - ./opencart-3.x/admin/view/template/extension/payment:/var/www/html/admin/view/template/extension/payment
      - ./opencart-3.x/admin/view/image/payment:/var/www/html/admin/view/image/payment
      - ./opencart-3.x/catalog/controller/extension/payment:/var/www/html/catalog/controller/extension/payment
      - ./opencart-3.x/catalog/language/en-gb/extension/payment:/var/www/html/catalog/language/en-gb/extension/payment
      - ./opencart-3.x/catalog/model/extension/payment:/var/www/html/catalog/model/extension/payment
      - ./opencart-3.x/catalog/view/theme/default/template/extension/payment:/var/www/html/catalog/view/theme/default/template/extension/payment
      - ./opencart-3.x/system/library/paynkolay.php:/var/www/html/system/library/paynkolay.php
    depends_on:
      - db

  # ──────────────────────────────────────────────
  # OpenCart 3.0.2.0 on PHP 7.2 — http://localhost:8032
  # (era-typical stack for merchants on OC < 3.0.3.7)
  # ──────────────────────────────────────────────
  opencart302:
    build:
      context: .
      dockerfile: docker/opencart-3.0.2/Dockerfile
    ports:
      - '8032:80'
    # Per-file mounts: folder mounts would hide core payment extensions
    # (cod, free_checkout) and fatal the checkout payment-method step.
    volumes:
      - ./opencart-3.x/admin/controller/extension/payment/nkolaypos.php:/var/www/html/admin/controller/extension/payment/nkolaypos.php
      - ./opencart-3.x/admin/language/en-gb/extension/payment/nkolaypos.php:/var/www/html/admin/language/en-gb/extension/payment/nkolaypos.php
      - ./opencart-3.x/admin/view/template/extension/payment/nkolaypos.twig:/var/www/html/admin/view/template/extension/payment/nkolaypos.twig
      - ./opencart-3.x/admin/view/image/payment/nkolay.png:/var/www/html/admin/view/image/payment/nkolay.png
      - ./opencart-3.x/catalog/controller/extension/payment/nkolaypos.php:/var/www/html/catalog/controller/extension/payment/nkolaypos.php
      - ./opencart-3.x/catalog/language/en-gb/extension/payment/nkolaypos.php:/var/www/html/catalog/language/en-gb/extension/payment/nkolaypos.php
      - ./opencart-3.x/catalog/model/extension/payment/nkolaypos.php:/var/www/html/catalog/model/extension/payment/nkolaypos.php
      - ./opencart-3.x/catalog/view/theme/default/template/extension/payment/nkolaypos.twig:/var/www/html/catalog/view/theme/default/template/extension/payment/nkolaypos.twig
      - ./opencart-3.x/system/library/paynkolay.php:/var/www/html/system/library/paynkolay.php
    depends_on:
      - db

  # ──────────────────────────────────────────────
  # OpenCart 4.0.2.3 — http://localhost:8040
  # ──────────────────────────────────────────────
  opencart4x:
    build:
      context: .
      dockerfile: docker/opencart-4.x/Dockerfile
    ports:
      - '8040:80'
    volumes:
      - ./opencart-4.x/admin/controller/payment:/var/www/html/extension/nkolay/admin/controller/payment
      - ./opencart-4.x/admin/language/en-gb/payment:/var/www/html/extension/nkolay/admin/language/en-gb/payment
      - ./opencart-4.x/admin/view/template/payment:/var/www/html/extension/nkolay/admin/view/template/payment
      - ./opencart-4.x/admin/view/image/payment:/var/www/html/extension/nkolay/admin/view/image/payment
      - ./opencart-4.x/catalog/controller/payment:/var/www/html/extension/nkolay/catalog/controller/payment
      - ./opencart-4.x/catalog/language/en-gb/payment:/var/www/html/extension/nkolay/catalog/language/en-gb/payment
      - ./opencart-4.x/catalog/model/payment:/var/www/html/extension/nkolay/catalog/model/payment
      - ./opencart-4.x/catalog/view/template/payment:/var/www/html/extension/nkolay/catalog/view/template/payment
      - ./opencart-4.x/system/library/paynkolay.php:/var/www/html/extension/nkolay/system/library/paynkolay.php
      - ./opencart-4.x/install.json:/var/www/html/extension/nkolay/install.json
    depends_on:
      - db

volumes:
  db_data:
